<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Weather app</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <video autoplay muted loop playsinline class="bg-video" id="bgVideo">
      <source src="#" type="video/mp4"  id="video"/>
      Your browser does not support the video tag.
    </video>

    <div class="container">
      <div class="weather-card">
        <div class="header">
          <form action="" id="form">
            <input class="input" placeholder="City" id="search" pattern="^[a-zA-Z\s\-']{2,}$" title="Please eneter a valid city" required/>
            <button type="submit" class="submit">🔍</button>
          </form>
        </div>
        <div class="main">
          <div class="date" id="date">13-21-30</div>
          <div class="weather-icon">
            <img src="./assets/final/clear-day.svg" id="weatherIcon" />
          </div>
          <div class="temperature">
            <div class="temp" id="temp">23</div>
            <div class="degrees">
              <p class="sign">o</p>
              <p class="temp-unit">C</p>
            </div>
          </div>
        </div>
        <div class="geoDetails">
          <div class="time" id="time">Time</div>
          <div class="city" id="city">City</div>
        </div>
      </div>
    </div>
  </body>
</html>
